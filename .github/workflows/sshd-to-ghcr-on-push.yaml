---
name: SSHD Docker Image on Push to GHCR

on:
  push:
    branches-ignore:
      - main

jobs:
  build_image_on_push:
    permissions:
      packages: write
      security-events: write
      contents: read
    uses: dbildungsplattform/dbp-github-workflows/.github/workflows/image-publish-trivy.yaml@094a0e74897bef119a5a8fc73da781ff1f2274e6 # 8.4.2
    with:
      image_name: "infra-sshd"
      container_registry: "ghcr.io"
      add_latest_tag: true
      image_tag_generation: "ticket_from_branch"
      run_trivy_scan: true
